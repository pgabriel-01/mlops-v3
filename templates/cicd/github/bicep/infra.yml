name: infra

on:
  pull_request:
    paths: ["infra/**", ".github/workflows/infra.yml"]
  push:
    branches: [main]
    paths: ["infra/**", ".github/workflows/infra.yml"]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: infra-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@[[versions.actions.checkout]]
      - run: az bicep build --file infra/main.bicep --stdout > /dev/null
      - uses: bridgecrewio/checkov-action@[[versions.actions.checkov]]
        with:
          directory: infra
          framework: bicep
          soft_fail: false

[[#each_env]]
  deploy-[[env]]:
    needs: [[needs]]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: [[env]]
    steps:
      - uses: actions/checkout@[[versions.actions.checkout]]
      - uses: azure/login@[[versions.actions.login]]
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: What-if
        run: >-
          az deployment sub what-if --location [[location]]
          --name infra-[[env]] --template-file infra/main.bicep
          --parameters infra/envs/[[env]].bicepparam
      - name: Deploy
        run: >-
          az deployment sub create --location [[location]]
          --name infra-[[env]] --template-file infra/main.bicep
          --parameters infra/envs/[[env]].bicepparam
[[/each_env]]

name: "2 - infra"

on:
  pull_request:
    paths: ["infra/**", ".github/workflows/infra.yml"]
  push:
    branches: [main]
    paths: ["infra/**", ".github/workflows/infra.yml"]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: infra-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: [[runner_label]]
    steps:
      - uses: actions/checkout@[[versions.actions.checkout]]
      - run: az bicep build --file infra/main.bicep --stdout > /dev/null
      - name: PSRule for Azure
        shell: pwsh
        env:
          PSRULE_CONFIGURATION_AZURE_BICEP_FILE_EXPANSION: 'true'
          PSRULE_CONFIGURATION_AZURE_BICEP_FILE_EXPANSION_TIMEOUT: '300'
        run: |
          Install-PSResource PSRule.Rules.Azure -Scope CurrentUser -TrustRepository
          $bicep = (Get-Command bicep -ErrorAction SilentlyContinue)?.Source
          if ($bicep) { $env:PSRULE_AZURE_BICEP_PATH = $bicep }
          Import-Module PSRule.Rules.Azure
          $files = Get-ChildItem infra/envs -Filter *.bicepparam
          $results = Invoke-PSRule -Module PSRule.Rules.Azure -InputPath $files.FullName -Format File
          $failed = @($results | Where-Object Outcome -eq 'Fail')
          foreach ($f in $failed) { Write-Host "::warning::$($f.RuleName) on $($f.TargetName)" }
          Write-Host "PSRule processed $(@($results).Count) results, $($failed.Count) findings."
          if (@($results).Count -eq 0 -or @($results | Where-Object Outcome -eq 'Error')) { throw 'PSRule did not scan the Bicep templates.' }

[[#each_env]]
  deploy-[[env]]:
    needs: [[needs]]
    if: github.event_name != 'pull_request'
    runs-on: [[runner_label]]
    environment: [[env]]
    steps:
      - uses: actions/checkout@[[versions.actions.checkout]]
      - uses: azure/login@[[versions.actions.login]]
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Resolve the deployer identity
        run: echo "DEPLOYER_PRINCIPAL_ID=$(az account get-access-token --query accessToken -o tsv | python3 -c "import sys,base64,json;t=sys.stdin.read().split('.')[1];print(json.loads(base64.urlsafe_b64decode(t+'='*(-len(t)%4)))['oid'])")" >> "$GITHUB_ENV"
      - name: What-if
        run: >-
          az deployment sub what-if --location [[location]]
          --name infra-[[env]] --template-file infra/main.bicep
          --parameters infra/envs/[[env]].bicepparam
      - name: Deploy
        run: >-
          az deployment sub create --location [[location]]
          --name infra-[[env]] --template-file infra/main.bicep
          --parameters infra/envs/[[env]].bicepparam
[[/each_env]]

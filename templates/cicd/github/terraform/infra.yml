name: "2 - infra"

on:
  pull_request:
    paths: ["infra/**", ".github/workflows/infra.yml"]
  push:
    branches: [main]
    paths: ["infra/**", ".github/workflows/infra.yml"]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: infra-${{ github.ref }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  ARM_USE_OIDC: "true"
  ARM_USE_AZUREAD: "true"

jobs:
  validate:
    runs-on: [[runner_label]]
    steps:
      - uses: actions/checkout@[[versions.actions.checkout]]
      - uses: hashicorp/setup-terraform@[[versions.actions.setup_terraform]]
        with:
          terraform_version: [[versions.terraform]]
      - run: terraform -chdir=infra fmt -check -recursive
      - run: terraform -chdir=infra init -backend=false
      - run: terraform -chdir=infra validate
      - uses: bridgecrewio/checkov-action@[[versions.actions.checkov]]
        with:
          directory: infra
          framework: terraform
          skip_check: CKV_TF_1
          soft_fail: false

[[#each_env]]
  deploy-[[env]]:
    needs: [[needs]]
    if: github.event_name != 'pull_request'
    runs-on: [[runner_label]]
    environment: [[env]]
    env:
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@[[versions.actions.checkout]]
      - uses: hashicorp/setup-terraform@[[versions.actions.setup_terraform]]
        with:
          terraform_version: [[versions.terraform]]
      - name: Init
        run: >-
          terraform -chdir=infra init
          -backend-config="resource_group_name=${{ vars.TFSTATE_RESOURCE_GROUP }}"
          -backend-config="storage_account_name=${{ vars.TFSTATE_STORAGE_ACCOUNT }}"
          -backend-config="container_name=${{ vars.TFSTATE_CONTAINER }}"
          -backend-config="key=[[env]].tfstate"
      - name: Plan
        run: terraform -chdir=infra plan -input=false -var-file=envs/[[env]].tfvars -out=[[env]].tfplan
      - name: Apply
        run: terraform -chdir=infra apply -input=false [[env]].tfplan
[[/each_env]]

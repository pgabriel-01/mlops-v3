name: "4 - ml-promote[[workload_label]]"

on:
  workflow_dispatch:
    inputs:
      source_environment:
        description: Environment whose workspace holds the trained model
        required: true
        default: [[first_env]]
        type: choice
        options: [[environments_yaml_list]]
      model_version:
        description: Model version to share (leave blank for the latest)
        required: false

permissions:
  id-token: write
  contents: read

jobs:
  promote:
    runs-on: [[runner_label]]
    environment: ${{ inputs.source_environment }}
    env:
      RG: rg-[[project_name]]-${{ inputs.source_environment }}-[[location_short]]
      WS: mlw-[[project_name]]-${{ inputs.source_environment }}-[[location_short]]
    steps:
      - uses: azure/login@[[versions.actions.login]]
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - run: az extension add --name ml --version [[versions.ml_cli_extension]] --yes
      - name: Share the model to the registry [[registry_name]]
        run: |
          V="${{ inputs.model_version }}"
          if [ -z "$V" ]; then
            V=$(az ml model list -n [[workload_name]]-model -g $RG -w $WS --query "max_by([], &to_number(version)).version" -o tsv)
          fi
          az ml model share -n [[workload_name]]-model -v "$V" --share-with-name [[workload_name]]-model --share-with-version "$V" \
            --registry-name [[registry_name]] -g $RG -w $WS

name: "4 - ml-deploy"

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: dev
        type: choice
        options: [[environments_yaml_list]]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      RG: rg-[[project_name]]-${{ inputs.environment }}-[[location_short]]
      WS: mlw-[[project_name]]-${{ inputs.environment }}-[[location_short]]
    steps:
      - uses: actions/checkout@[[versions.actions.checkout]]
      - uses: azure/login@[[versions.actions.login]]
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - run: az extension add --name ml --version [[versions.ml_cli_extension]] --yes
      - name: Endpoint
        run: az ml online-endpoint create -f mlops/azureml/online-endpoint.yml -g $RG -w $WS
      - name: Deployment
        run: >-
          az ml online-deployment create -f mlops/azureml/online-deployment.yml
          --all-traffic -g $RG -w $WS

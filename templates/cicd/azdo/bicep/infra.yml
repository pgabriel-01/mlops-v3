trigger:
  branches:
    include: [main]
  paths:
    include: [infra]

pool:
  vmImage: ubuntu-latest

stages:
  - stage: validate
    jobs:
      - job: validate
        steps:
          - script: az bicep build --file infra/main.bicep --stdout > /dev/null
            displayName: Bicep build
          - task: PowerShell@2
            displayName: PSRule for Azure
            env:
              PSRULE_CONFIGURATION_AZURE_BICEP_FILE_EXPANSION: 'true'
              PSRULE_CONFIGURATION_AZURE_BICEP_FILE_EXPANSION_TIMEOUT: '300'
            inputs:
              targetType: inline
              pwsh: true
              script: |
                Install-PSResource PSRule.Rules.Azure -Scope CurrentUser -TrustRepository
                $bicep = (Get-Command bicep -ErrorAction SilentlyContinue)?.Source
                if (-not $bicep) { $bicep = "$HOME/.azure/bin/bicep" }
                $env:PSRULE_AZURE_BICEP_PATH = $bicep
                Import-Module PSRule.Rules.Azure
                $files = Get-ChildItem infra/envs -Filter *.bicepparam
                $results = Invoke-PSRule -Module PSRule.Rules.Azure -InputPath $files.FullName -Format File
                $failed = @($results | Where-Object Outcome -eq 'Fail')
                foreach ($f in $failed) { Write-Host "##vso[task.logissue type=warning]$($f.RuleName) on $($f.TargetName)" }
                Write-Host "PSRule processed $(@($results).Count) results, $($failed.Count) findings."
                if (@($results).Count -eq 0 -or @($results | Where-Object Outcome -eq 'Error')) { throw 'PSRule did not scan the Bicep templates.' }

[[#each_env]]
  - stage: deploy_[[env]]
    dependsOn: [[needs_azdo]]
    condition: succeeded()
    jobs:
      - deployment: deploy
        environment: [[env]]
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - task: AzureCLI@2
                  displayName: What-if and deploy
                  inputs:
                    azureSubscription: [[project_name]]-[[env]]
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      export DEPLOYER_PRINCIPAL_ID=$(az account get-access-token --query accessToken -o tsv | python3 -c "import sys,base64,json;t=sys.stdin.read().split('.')[1];print(json.loads(base64.urlsafe_b64decode(t+'='*(-len(t)%4)))['oid'])")
                      az deployment sub what-if --location [[location]] --name infra-[[env]] \
                        --template-file infra/main.bicep --parameters infra/envs/[[env]].bicepparam
                      az deployment sub create --location [[location]] --name infra-[[env]] \
                        --template-file infra/main.bicep --parameters infra/envs/[[env]].bicepparam
[[/each_env]]

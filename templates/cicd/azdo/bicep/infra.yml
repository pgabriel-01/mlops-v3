trigger:
  branches:
    include: [main]
  paths:
    include: [infra]

pool:
  vmImage: ubuntu-latest

stages:
  - stage: validate
    jobs:
      - job: validate
        steps:
          - script: az bicep build --file infra/main.bicep --stdout > /dev/null
            displayName: Bicep build
          - script: |
              python -m pip install checkov
              checkov -d infra --framework bicep
            displayName: Checkov

[[#each_env]]
  - stage: deploy_[[env]]
    dependsOn: [[needs_azdo]]
    condition: succeeded()
    jobs:
      - deployment: deploy
        environment: [[env]]
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - task: AzureCLI@2
                  displayName: What-if and deploy
                  inputs:
                    azureSubscription: [[project_name]]-[[env]]
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      export DEPLOYER_PRINCIPAL_ID=$(az account get-access-token --query accessToken -o tsv | python3 -c "import sys,base64,json;t=sys.stdin.read().split('.')[1];print(json.loads(base64.urlsafe_b64decode(t+'='*(-len(t)%4)))['oid'])")
                      az deployment sub what-if --location [[location]] --name infra-[[env]] \
                        --template-file infra/main.bicep --parameters infra/envs/[[env]].bicepparam
                      az deployment sub create --location [[location]] --name infra-[[env]] \
                        --template-file infra/main.bicep --parameters infra/envs/[[env]].bicepparam
[[/each_env]]

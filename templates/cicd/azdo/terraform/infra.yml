trigger:
  branches:
    include: [main]
  paths:
    include: [infra]

pool:
  vmImage: ubuntu-latest

stages:
  - stage: validate
    jobs:
      - job: validate
        steps:
          - script: |
              curl -fsSL https://releases.hashicorp.com/terraform/[[versions.terraform]]/terraform_[[versions.terraform]]_linux_amd64.zip -o tf.zip
              unzip -o tf.zip -d "$HOME/bin" && echo "##vso[task.prependpath]$HOME/bin"
            displayName: Install Terraform [[versions.terraform]]
          - script: |
              terraform -chdir=infra fmt -check -recursive
              terraform -chdir=infra init -backend=false
              terraform -chdir=infra validate
            displayName: Validate
          - script: |
              python -m pip install checkov
              checkov -d infra --framework terraform --skip-check CKV_TF_1
            displayName: Checkov

[[#each_env]]
  - stage: deploy_[[env]]
    dependsOn: [[needs_azdo]]
    condition: succeeded()
    jobs:
      - deployment: deploy
        environment: [[env]]
        variables:
          - group: [[project_name]]-[[env]]
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - script: |
                    curl -fsSL https://releases.hashicorp.com/terraform/[[versions.terraform]]/terraform_[[versions.terraform]]_linux_amd64.zip -o tf.zip
                    unzip -o tf.zip -d "$HOME/bin" && echo "##vso[task.prependpath]$HOME/bin"
                  displayName: Install Terraform
                - task: AzureCLI@2
                  displayName: Terraform apply
                  inputs:
                    azureSubscription: [[project_name]]-[[env]]
                    scriptType: bash
                    scriptLocation: inlineScript
                    addSpnToEnvironment: true
                    inlineScript: |
                      export ARM_USE_OIDC=true ARM_USE_AZUREAD=true
                      export ARM_CLIENT_ID=$servicePrincipalId ARM_TENANT_ID=$tenantId
                      export ARM_OIDC_TOKEN=$idToken ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)
                      terraform -chdir=infra init \
                        -backend-config="resource_group_name=$(TFSTATE_RESOURCE_GROUP)" \
                        -backend-config="storage_account_name=$(TFSTATE_STORAGE_ACCOUNT)" \
                        -backend-config="container_name=$(TFSTATE_CONTAINER)" \
                        -backend-config="key=[[env]].tfstate"
                      terraform -chdir=infra apply -input=false -auto-approve -var-file=envs/[[env]].tfvars
[[/each_env]]

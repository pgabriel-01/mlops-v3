trigger: none

parameters:
  - name: environment
    displayName: Target environment
    type: string
    default: dev
    values: [[environments_yaml_list]]

pool:
  vmImage: ubuntu-latest

stages:
  - stage: deploy
    jobs:
      - deployment: deploy
        environment: ${{ parameters.environment }}
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - task: AzureCLI@2
                  inputs:
                    azureSubscription: [[project_name]]-${{ parameters.environment }}
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      RG=rg-[[project_name]]-${{ parameters.environment }}-[[location_short]]
                      WS=mlw-[[project_name]]-${{ parameters.environment }}-[[location_short]]
                      az extension add --name ml --version [[versions.ml_cli_extension]] --yes
                      az ml online-endpoint create -f [[workload_dir]]mlops/azureml/online-endpoint.yml -g $RG -w $WS
                      az ml online-deployment create -f [[workload_dir]]mlops/azureml/online-deployment.yml --all-traffic -g $RG -w $WS

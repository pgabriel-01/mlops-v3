$schema: https://azuremlschemas.azureedge.net/latest/commandComponent.schema.json
type: command
# Registers the model when the evaluation approved it.
name: [[workload_slug]]_register
display_name: register-model
description: Register the model when the evaluation set the deploy flag.
code: ../../../src
environment: azureml:[[workload_name]]-train-env@latest
inputs:
  model_name:
    type: string
  model_path:
    type: mlflow_model
  evaluation_output:
    type: uri_folder
outputs:
  model_info_output_path:
    type: uri_folder
command: >-
  python register.py
  --model_name ${{inputs.model_name}}
  --model_path ${{inputs.model_path}}
  --evaluation_output ${{inputs.evaluation_output}}
  --model_info_output_path ${{outputs.model_info_output_path}}

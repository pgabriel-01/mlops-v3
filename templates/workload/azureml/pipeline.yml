$schema: https://azuremlschemas.azureedge.net/latest/pipelineJob.schema.json
type: pipeline
experiment_name: [[workload_name]]-training
display_name: [[workload_name]]-training
description: Train, evaluate and conditionally register a taxi fare model.

inputs:
  raw_data:
    type: [[data_type]]
    mode: ro_mount
    path: azureml:[[workload_name]]-data@latest

outputs:
  trained_model:
  evaluation_output:
  model_info_output_path:

settings:
  default_datastore: azureml:workspaceblobstore
  default_compute: azureml:cpu-cluster
  continue_on_step_failure: false

jobs:
  prep_data:
    type: command
    component: azureml:[[workload_slug]]_prep@latest
    inputs:
      raw_data: ${{parent.inputs.raw_data}}

  train_model:
    type: command
    component: azureml:[[workload_slug]]_train@latest
    inputs:
      train_data: ${{parent.jobs.prep_data.outputs.train_data}}

  evaluate_model:
    type: command
    component: azureml:[[workload_slug]]_evaluate@latest
    inputs:
      model_name: [[workload_name]]-model
      model_input: ${{parent.jobs.train_model.outputs.model_output}}
      test_data: ${{parent.jobs.prep_data.outputs.test_data}}
    outputs:
      evaluation_output: ${{parent.outputs.evaluation_output}}

  register_model:
    type: command
    component: azureml:[[workload_slug]]_register@latest
    inputs:
      model_name: [[workload_name]]-model
      model_path: ${{parent.jobs.train_model.outputs.model_output}}
      evaluation_output: ${{parent.jobs.evaluate_model.outputs.evaluation_output}}
    outputs:
      model_info_output_path: ${{parent.outputs.model_info_output_path}}

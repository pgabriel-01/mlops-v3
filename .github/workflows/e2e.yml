name: End-to-end tests
# Real Azure tests of the generated IaC. Plan runs for PRs labelled "safe-to-test";
# apply and destroy run only on manual dispatch (apply=true), one or a few scenarios at a time.
# Requires an `e2e` environment with AZURE_CLIENT_ID, AZURE_TENANT_ID and AZURE_SUBSCRIPTION_ID
# (a federated identity with Contributor and Role Based Access Control Administrator on a dedicated test subscription).
on:
  pull_request:
    types: [opened, reopened, synchronize, labeled]
  workflow_dispatch:
    inputs:
      apply:
        description: Apply, verify and destroy (otherwise plan only)
        type: boolean
        default: false
      scenarios:
        description: Comma-separated scenario numbers, for example 4 or 4,5
        required: true
permissions:
  contents: read
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: false
jobs:
  matrix:
    runs-on: ubuntu-latest
    if: github.repository == 'pgabriel-01/mlops-v3' && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'safe-to-test'))
    outputs:
      include: ${{ steps.m.outputs.include }}
      apply: ${{ steps.m.outputs.apply }}
    steps:
      - id: m
        shell: pwsh
        run: |
          $all = @(
            @{ n = 1; id = 'basic-public' }, @{ n = 2; id = 'managed-vnet-internet' }, @{ n = 3; id = 'managed-vnet-approved' },
            @{ n = 4; id = 'byo-vnet' }, @{ n = 5; id = 'batch-scoring' }, @{ n = 6; id = 'online-bluegreen' },
            @{ n = 7; id = 'feature-store' }, @{ n = 8; id = 'registry-promotion' }, @{ n = 9; id = 'governance' },
            @{ n = 10; id = 'genai-foundry' }, @{ n = 11; id = 'existing-platform' }, @{ n = 12; id = 'rag-llmops' })
          $pick = '${{ inputs.scenarios }}'
          if ($pick) { $set = $pick -split ',' | ForEach-Object { [int]$_.Trim() }; $all = $all | Where-Object { $set -contains $_.n } }
          $rows = foreach ($s in $all) { foreach ($iac in 'terraform', 'bicep') { @{ n = $s.n; id = $s.id; iac = $iac } } }
          $apply = ('${{ inputs.apply }}' -eq 'true')
          "include=$(ConvertTo-Json -InputObject @($rows) -Compress)" >> $env:GITHUB_OUTPUT
          "apply=$($apply.ToString().ToLower())" >> $env:GITHUB_OUTPUT

  e2e:
    needs: matrix
    name: ${{ matrix.n }}-${{ matrix.id }} (${{ matrix.iac }})
    runs-on: ubuntu-latest
    environment: e2e
    timeout-minutes: 120
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.include) }}
    env:
      ARM_USE_OIDC: 'true'
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_wrapper: false
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - shell: pwsh
        run: Install-PSResource powershell-yaml -TrustRepository
      - name: Render
        shell: pwsh
        run: |
          Import-Module ./src/MLOpsAccelerator/MLOpsAccelerator.psd1 -Force
          $suffix = 'e{0:x2}' -f ([int]'${{ github.run_number }}' % 240 + 16)   # unique per run: avoids soft-delete name collisions
          $suffix = $suffix.Substring(0, [Math]::Min(3, $suffix.Length)) + '${{ matrix.iac }}'.Substring(0, 1)   # iac letter keeps parallel Terraform/Bicep jobs from sharing resource names
          $null = New-MLOpsInputFile -Scenario ${{ matrix.id }} -Path in.yaml -Iac ${{ matrix.iac }} -Cicd github -Force
          $proj = 'e2e${{ matrix.n }}' + $suffix.Substring(1)   # unique per run and IaC; soft-deleted AML workspaces block name reuse
          "E2E_PROJECT=$proj" >> $env:GITHUB_ENV
          $y = Get-Content -Raw in.yaml
          $y = $y -replace '(?m)^subscription_id:.*', 'subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}' -replace '(?m)^tenant_id:.*', 'tenant_id: ${{ secrets.AZURE_TENANT_ID }}' -replace '(?m)^project_name:.*', "project_name: $proj" -replace '(?m)^environments:.*', 'environments: [dev]'
          if (${{ matrix.n }} -eq 11) {
            # Stand-in for the platform team's landing zone: VNet and subnet, Log Analytics and private DNS zones.
            $y = $y -replace '00000000-0000-0000-0000-000000000000', '${{ secrets.AZURE_SUBSCRIPTION_ID }}' -replace 'rg-platform', "rg-$proj-plat" -replace 'rg-dns', "rg-$proj-plat"
            $rg = "rg-$proj-plat"
            az group create -n $rg -l eastus2 -o none
            az network vnet create -g $rg -n vnet-platform --address-prefixes 10.50.0.0/16 --subnet-name snet-ml --subnet-prefixes 10.50.0.0/24 -o none
            az monitor log-analytics workspace create -g $rg -n law-platform -l eastus2 -o none
            foreach ($z in 'privatelink.blob.core.windows.net', 'privatelink.file.core.windows.net', 'privatelink.vaultcore.azure.net', 'privatelink.azurecr.io', 'privatelink.api.azureml.ms', 'privatelink.notebooks.azure.net') {
              az network private-dns zone create -g $rg -n $z -o none
              az network private-dns link vnet create -g $rg -z $z -n "link-$($z.Split('.')[1])" -v vnet-platform -e false -o none
            }
          }
          Set-Content in.yaml ($y + "`nname_suffix: $suffix`nkeyvault_retention_days: 7`n")
          Deploy-MLOpsAccelerator -InputFile in.yaml -OutputPath out -SkipVersionCheck
      - name: Terraform plan
        if: matrix.iac == 'terraform'
        run: |
          printf 'terraform {\n  backend "local" {}\n}\n' > out/infra/backend_override.tf
          terraform -chdir=out/infra init -input=false
          terraform -chdir=out/infra plan -input=false -var-file=envs/dev.tfvars -out=dev.tfplan
      - name: Bicep what-if
        if: matrix.iac == 'bicep'
        run: |
          az deployment sub what-if --location eastus2 --template-file out/infra/main.bicep --parameters out/infra/envs/dev.bicepparam --no-pretty-print > /dev/null
      - name: Apply
        if: needs.matrix.outputs.apply == 'true' && matrix.iac == 'terraform'
        run: terraform -chdir=out/infra apply -input=false dev.tfplan
      - name: Apply (Bicep)
        if: needs.matrix.outputs.apply == 'true' && matrix.iac == 'bicep'
        run: az deployment sub create --name e2e-${{ github.run_number }}-${{ matrix.n }} --location eastus2 --template-file out/infra/main.bicep --parameters out/infra/envs/dev.bicepparam
      - name: Sign in again (token expires during long deployments)
        if: always() && needs.matrix.outputs.apply == 'true'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Verify workspace
        if: needs.matrix.outputs.apply == 'true'
        run: |
          rg=$(az group list --query "[?starts_with(name,'rg-${E2E_PROJECT}-dev-')].name | [0]" -o tsv)
          test -n "$rg"
          az extension add -n ml -y -o none
          az ml workspace list -g "$rg" --query "[].name" -o tsv | grep -q .
      - name: Destroy
        if: always() && needs.matrix.outputs.apply == 'true'
        run: |
          if [ "${{ matrix.iac }}" = terraform ]; then
            terraform -chdir=out/infra destroy -auto-approve -input=false -var-file=envs/dev.tfvars || true
          fi
          for rg in $(az group list --query "[?starts_with(name,'rg-${E2E_PROJECT}-')].name" -o tsv); do
            for id in $(az lock list -g "$rg" --query "[].id" -o tsv); do az lock delete --ids "$id" || true; done
          done
          for rg in $(az group list --query "[?starts_with(name,'rg-${E2E_PROJECT}-')].name" -o tsv); do az group delete -n "$rg" --yes --no-wait; done
          for kv in $(az keyvault list-deleted --query "[?starts_with(name,'kv-${E2E_PROJECT}-')].name" -o tsv); do az keyvault purge --name "$kv" --no-wait || true; done

  finish:
    needs: [matrix, e2e]
    if: always() && needs.matrix.outputs.apply == 'true'
    name: Summary and cleanup
    runs-on: ubuntu-latest
    environment: e2e
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Remove leftover test resource groups
        run: |
          # Runs are serialized by the concurrency group, so anything still named rg-e2e* is left over from a failed job.
          for rg in $(az group list --query "[?starts_with(name,'rg-e2e')].name" -o tsv); do
            for id in $(az lock list -g "$rg" --query "[].id" -o tsv); do az lock delete --ids "$id" || true; done
            echo "Deleting leftover $rg"
            az group delete -n "$rg" --yes --no-wait
          done
      - name: Report
        env:
          RESULT: ${{ needs.e2e.result }}
        run: |
          echo "Matrix result: $RESULT" >> "$GITHUB_STEP_SUMMARY"
          if [ "$RESULT" != success ]; then
            exit 1
          fi

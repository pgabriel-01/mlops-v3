name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PSGALLERY_API_KEY: ${{ secrets.PSGALLERY_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Test
        shell: pwsh
        run: |
          Install-PSResource Pester, powershell-yaml -TrustRepository
          Invoke-Pester ./tests -CI
      - name: Build module
        shell: pwsh
        run: ./scripts/Build-Module.ps1 -Version $env:GITHUB_REF_NAME
      - name: Package
        run: cd build && zip -r "../mlops-v3-${GITHUB_REF_NAME}.zip" MLOpsAccelerator
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: mlops-v3-*.zip
          prerelease: ${{ contains(github.ref_name, '-') }}
      - name: Publish to PowerShell Gallery
        if: env.PSGALLERY_API_KEY != ''
        shell: pwsh
        run: Publish-PSResource -Path build/MLOpsAccelerator -Repository PSGallery -ApiKey $env:PSGALLERY_API_KEY

name: ci
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 1'
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Windows/macOS minutes cost 2x/10x, so run them on PRs, schedule and manual runs only
        os: ${{ fromJSON(github.event_name == 'push' && '["ubuntu-latest"]' || '["ubuntu-latest","windows-latest","macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
      - shell: pwsh
        run: |
          Install-PSResource Pester, powershell-yaml -TrustRepository
          Invoke-Pester ./tests -CI
      - shell: pwsh
        run: |
          Import-Module ./src/MLOpsAccelerator/MLOpsAccelerator.psd1
          foreach ($iac in 'terraform','bicep') { foreach ($cicd in 'github','azdo') {
            $y = (Get-Content -Raw inputs.example.yaml) -replace '(?m)^iac:.*',"iac: $iac" -replace '(?m)^cicd:.*',"cicd: $cicd"
            if ($cicd -eq 'azdo') { $y = ($y -replace '(?m)^github_(org|repo).*\n','') + "`nazdo_org_url: https://dev.azure.com/o`nazdo_project: p`n" }
            Set-Content in.yaml $y
            Deploy-MLOpsAccelerator -InputFile in.yaml -OutputPath "out/$iac-$cicd" -SkipVersionCheck
          } }
          foreach ($d in 'out/terraform-github/infra','out/terraform-github/bootstrap','out/terraform-azdo/bootstrap') {
            terraform "-chdir=$d" init -backend=false; terraform "-chdir=$d" validate; if ($LASTEXITCODE) { exit 1 }
          }
          az bicep build --file out/bicep-github/infra/main.bicep
  matrix:
    name: ${{ matrix.scenario }} - ${{ matrix.id }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { scenario: 1, id: basic-public }
          - { scenario: 2, id: managed-vnet-internet }
          - { scenario: 3, id: managed-vnet-approved }
          - { scenario: 4, id: byo-vnet }
          - { scenario: 5, id: batch-scoring }
          - { scenario: 6, id: online-bluegreen }
          - { scenario: 7, id: feature-store }
          - { scenario: 8, id: registry-promotion }
          - { scenario: 9, id: governance }
          - { scenario: 10, id: genai-foundry }
          - { scenario: 11, id: existing-platform }
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
      - shell: pwsh
        run: Install-PSResource powershell-yaml -TrustRepository
      - name: Render and validate (Terraform and Bicep)
        shell: pwsh
        run: |
          New-Item -ItemType Directory results | Out-Null
          ./tests/Invoke-ScenarioMatrix.ps1 -Scenario ${{ matrix.scenario }} -ResultsPath results/${{ matrix.scenario }}.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: results-${{ matrix.scenario }}
          path: results
  report:
    needs: matrix
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: results-*
          merge-multiple: true
          path: results
      - name: Build report
        shell: pwsh
        run: |
          $rows = Get-ChildItem results -Filter *.json | ForEach-Object { Get-Content -Raw $_ | ConvertFrom-Json } | Sort-Object scenario, iac
          $lines = @("## Scenario matrix results", "", "Commit ``$($env:GITHUB_SHA.Substring(0,7))``. Checks: render, no leftover tokens, ``terraform validate``/``fmt`` or ``bicep build``, bootstrap validate. No Azure deployment.", "", "| Scenario | Name | IaC | CI/CD | Result | Time | Checks |", "|---|---|---|---|---|---|---|")
          foreach ($r in $rows) { $lines += "| $($r.scenario) | $($r.name) | $($r.iac) | $($r.cicd) | $(if ($r.status -eq 'pass') { ':white_check_mark: pass' } else { ':x: fail' }) | $($r.seconds)s | $($r.checks) |" }
          $failed = @($rows | Where-Object status -eq 'fail').Count
          $lines += "", "**$(@($rows).Count - $failed) of $(@($rows).Count) passed.**"
          if (-not $rows) { $lines += "No results were produced. Check the scenario jobs." }
          $lines -join "`n" | Set-Content report.md
          Get-Content report.md >> $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v7
        with:
          name: matrix-report
          path: report.md
      - name: Comment on PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo '<!-- matrix-report -->'; cat report.md; } > body.md
          id=$(gh api repos/${{ github.repository }}/issues/${{ github.event.number }}/comments --jq '[.[] | select(.body | startswith("<!-- matrix-report -->"))][0].id // empty')
          if [ -n "$id" ]; then gh api -X PATCH repos/${{ github.repository }}/issues/comments/$id -F body=@body.md
          else gh pr comment ${{ github.event.number }} --repo ${{ github.repository }} --body-file body.md; fi
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: peaceiris/actions-hugo@v3
        with: { hugo-version: '0.168.0', extended: true }
      - name: Build docs (fail on warnings)
        run: |
          hugo --source site --minify --printI18nWarnings --printPathWarnings 2>&1 | tee build.log
          ! grep -E "^(WARN|ERROR)" build.log
      - uses: actions/upload-artifact@v7
        with:
          name: docs-site
          path: _site

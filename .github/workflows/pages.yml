name: Docs site
on:
  push:
    branches: [main]
    paths: ['docs/**', 'site/**']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build:
    if: vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: peaceiris/actions-hugo@v3
        with: { hugo-version: '0.168.0', extended: true }
      - id: cfg
        uses: actions/configure-pages@v6
      - run: hugo --source site --minify --baseURL "${{ steps.cfg.outputs.base_url }}/"
      - uses: actions/upload-pages-artifact@v5
        with: { path: _site }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.d.outputs.page_url }}' }
    steps:
      - id: d
        uses: actions/deploy-pages@v5
